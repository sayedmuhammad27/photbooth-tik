services:
  - type: web
    name: photobooth-tik
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Photobooth TIK"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: PHOTOBOOTH_COUNTDOWN
        value: "3"
      - key: PHOTOBOOTH_ADVANCE_MODE
        value: manual
      - key: ADMIN_EMAIL
        value: admin@photobooth.tik
      - key: ADMIN_PASSWORD
        value: AdminTik2026!

